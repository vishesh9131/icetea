# Unified icetea: landing (/) + terminal (/app) + JS API proxy (/healthz, /v1/*).
# Python FastAPI cannot run on Netlify — it lives on Render; functions proxy to BACKEND_URL.

[build]
  command = "bash scripts/build-netlify-unified.sh"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  APP_ENV = "production"
  VITE_TERMINAL_URL = "/app/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Terminal SPA at /app ----------------------------------------------------
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# --- Landing SPA at / (after API function routes) --------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
