# Unified icetea: landing (/) + terminal (/app) + API proxy to Render.

[build]
  command = "bash scripts/build-netlify-unified.sh"
  publish = "dist"

[build.environment]
  APP_ENV = "production"
  VITE_TERMINAL_URL = "/app/"
  # Fallback if BACKEND_URL not set in Netlify UI at build time
  BACKEND_URL = "https://icetea-api-4fjb.onrender.com"

# --- API: proxy to Render (must be before SPA fallbacks) -------------------
[[redirects]]
  from = "/healthz"
  to = "https://icetea-api-4fjb.onrender.com/healthz"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "https://icetea-api-4fjb.onrender.com/v1/:splat"
  status = 200
  force = true

# --- Terminal SPA at /app ----------------------------------------------------
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# --- Landing SPA at / --------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
